name: Track Morphe what's new

on:
  schedule:
    - cron: "0 10,22 * * *" # 10:00 and 22:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download the JSON
        run: |
          curl -fsSL https://morphe-patches.software/data/whats-new.json -o /tmp/whats-new.json
          # app names + icons; if this fails the email just falls back to package ids
          curl -fsSL https://morphe-patches.software/data/bundles.json -o /tmp/bundles.json || echo '{}' > /tmp/bundles.json

      - name: Work out what is new and build the feed
        run: python3 .github/scripts/track_whats_new.py

      - name: Commit if something is new
        run: |
          if [ ! -s /tmp/commit-msg.txt ]; then
            echo "Nothing new"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json feed.xml
          [ -f feed_items.json ] && git add feed_items.json
          git commit -F /tmp/commit-msg.txt
          git push
