name: Track Morphe what's new

on:
  schedule:
    - cron: "0 22 * * *"   # daily at 22:00 UTC (midnight in Belgium in summer)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and pretty-print the JSON
        run: curl -fsSL https://morphe-patches.software/data/whats-new.json | jq . > whats-new.json

      - name: Commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whats-new.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          DATE=$(jq -r '.[0].date' whats-new.json)
          BUNDLES=$(jq -r '.[0].bundles | keys | join(", ")' whats-new.json)
          git commit -m "What's new $DATE: $BUNDLES"
          git push
